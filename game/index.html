<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#21221e">
  <title>长宁白事铺</title>
  <link rel="icon" href="./lantern.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.min.js" } }
  </script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="wordmark"><span class="seal" aria-hidden="true">灯</span> 长宁白事铺</div>
      <div class="masthead-actions">
        <button type="button" class="notebook-button" id="open-notebook" aria-haspopup="dialog" aria-keyshortcuts="N" title="打开笔记本 (N)">
          <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
            <path d="M6 3h10v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 14v-3h10M8 6.5h5m-5 3h4"/>
          </svg>
          笔记本 <span id="notebook-count" aria-hidden="true">0</span>
        </button>
      </div>
    </header>
    <main>
      <section class="chapter" aria-labelledby="chapter-title">
        <p class="eyebrow" id="chapter-name"></p>
        <h1 id="chapter-title"></h1>
        <p class="scene-time"><b id="scene-place"></b><span></span><b id="scene-time"></b></p>
        <p class="intro" id="scene-intro"></p>
        <div class="rule"></div>
        <p class="hint" id="guide"></p>
        <div class="chapter-actions">
          <button type="button" id="chapter-next" class="chapter-next" hidden></button>
          <button type="button" id="chapter-skip" class="chapter-skip" hidden>跳过选项</button>
        </div>
      </section>
      <section class="stage" id="stage" aria-labelledby="chapter-title" aria-describedby="guide">
        <div class="stage-label"><i></i><b id="stage-chapter"></b></div>
        <div class="stage-place" id="stage-place"></div>
        <p id="loading" role="status">正在载入……</p>
        <p id="scene-notice" class="scene-notice" role="status" hidden></p>
        <div class="scene-curtain" id="scene-curtain" aria-hidden="true"></div>
        <button type="button" class="inspect" id="inspect" hidden><kbd>E</kbd><span></span></button>
        <div class="dpad" id="dpad" aria-label="移动角色">
          <button type="button" data-move="ArrowUp" aria-label="向上">↑</button>
          <button type="button" data-move="ArrowLeft" aria-label="向左">←</button>
          <button type="button" data-move="ArrowDown" aria-label="向下">↓</button>
          <button type="button" data-move="ArrowRight" aria-label="向右">→</button>
        </div>
      </section>
    </main>
    <footer class="controls" aria-label="操作说明">
      <div><kbd>W A S D</kbd><span class="or">或</span><kbd>↑ ↓ ← →</kbd><span>移动</span></div>
      <div><kbd>E</kbd><span>交互</span></div>
      <div><kbd>N</kbd><span>笔记本</span></div>
      <button type="button" id="movement-mode" aria-label="奔跑模式" aria-pressed="false" aria-keyshortcuts="Shift" disabled><kbd>Shift</kbd><span>步行</span></button>
      <button type="button" id="reset" disabled>↺ <span>回到门口</span></button>
    </footer>
  </div>
  <dialog id="journal" class="folio" aria-labelledby="notebook-title">
    <header class="folio-header">
      <div class="folio-brand"><span aria-hidden="true">记</span> 见闻</div>
      <button type="button" class="folio-back" id="journal-skip" hidden>跳过选项</button>
      <button type="button" class="folio-back" id="notebook-back" hidden>← 返回笔记本</button>
      <form method="dialog"><button type="submit" class="folio-close" aria-label="关闭" title="关闭 (Esc)">×</button></form>
    </header>
    <section id="entry-detail" class="entry-detail" hidden>
      <article class="item-copy">
        <p class="eyebrow" id="entry-kind"></p>
        <h2 id="entry-title" tabindex="-1"></h2>
        <p id="entry-description" class="item-description"></p>
        <dl class="item-facts" id="entry-facts">
          <div><dt id="entry-fact-label"></dt><dd id="entry-fact"></dd></div>
        </dl>
        <div class="item-memory" id="entry-memory">
          <p class="eyebrow" id="entry-memory-label"></p>
          <div class="memory-text" id="entry-sections"></div>
        </div>
      </article>
      <figure class="item-display" id="item-display" aria-labelledby="model-title">
        <div class="display-heading"><span id="model-title">物件模型</span><span aria-hidden="true">3D</span></div>
        <div class="model-view" id="model-view">
          <p id="model-error" role="status" hidden>模型暂时无法显示。</p>
        </div>
        <figcaption class="display-footer">
          <span id="model-hint">拖动旋转 · 滚轮缩放</span>
          <div class="model-controls" id="model-controls">
            <button type="button" data-turn="-1" aria-label="向左旋转" title="向左旋转">↶</button>
            <button type="button" data-turn="0" aria-label="复位视角" title="复位视角">⌾</button>
            <button type="button" data-turn="1" aria-label="向右旋转" title="向右旋转">↷</button>
          </div>
        </figcaption>
      </figure>
    </section>
    <section id="notebook" class="notebook" hidden>
      <h2 id="notebook-title" tabindex="-1">笔记本</h2>
      <nav class="notebook-tabs" id="notebook-tabs" aria-label="笔记本分类">
        <button type="button" data-category="characters" aria-pressed="true" aria-controls="notebook-list">人物 <span></span></button>
        <button type="button" data-category="stories" aria-pressed="false" aria-controls="notebook-list">故事 <span></span></button>
        <button type="button" data-category="objects" aria-pressed="false" aria-controls="notebook-list">物件 <span></span></button>
      </nav>
      <p id="notebook-empty" class="notebook-empty"></p>
      <ul class="notebook-list" id="notebook-list"></ul>
    </section>
  </dialog>
  <dialog id="conversation" class="folio conversation" aria-label="对话">
    <header class="folio-header">
      <div class="folio-brand"><span aria-hidden="true">谈</span> 交谈</div>
      <form method="dialog"><button type="submit" class="folio-close" aria-label="退出对话" title="退出对话 (Esc)">×</button></form>
    </header>
    <div class="conversation-body" aria-live="polite" aria-atomic="true">
      <p class="eyebrow" id="conversation-speaker"></p>
      <p class="conversation-line" id="conversation-line"></p>
    </div>
    <footer class="conversation-actions">
      <span id="conversation-count"></span>
      <button type="button" id="conversation-next"></button>
    </footer>
  </dialog>
  <dialog id="activity" class="folio activity" aria-labelledby="activity-title">
    <header class="folio-header">
      <div class="folio-brand"><span aria-hidden="true">灯</span><span id="activity-kind"></span></div>
      <button type="button" class="folio-back" id="activity-skip" hidden>跳过选项</button>
      <form method="dialog"><button type="submit" class="folio-close" aria-label="关闭" title="关闭 (Esc)">×</button></form>
    </header>
    <div class="activity-body">
      <div class="activity-copy">
        <h2 id="activity-title" tabindex="-1"></h2>
        <p id="activity-description"></p>
        <p id="activity-feedback" class="activity-feedback" role="status" hidden></p>
      </div>
      <div id="activity-model" class="model-view activity-model" hidden></div>
      <section id="activity-puzzle" class="puzzle" hidden></section>
      <label id="activity-drag" class="activity-drag" hidden>
        <span id="activity-drag-label"></span>
        <input type="range" id="activity-drag-range" min="0" max="100" value="0">
      </label>
      <div class="activity-options" id="activity-options"></div>
    </div>
  </dialog>
</body>
</html>
